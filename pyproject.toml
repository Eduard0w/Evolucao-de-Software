[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commonmark"
version = "0.9.2"
description = "Python parser for the CommonMark Markdown spec"
readme = { file = "README.rst", content-type = "text/x-rst" }
license = "BSD-3-Clause"

authors = [
    { name = "Bibek Kafle", email = "bkafle662@gmail.com" },
    { name = "Roland Shoemaker", email = "rolandshoemaker@gmail.com" }
]

urls = { Homepage = "https://github.com/rtfd/commonmark.py" }

keywords = ["markup", "markdown", "commonmark"]

classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Environment :: Other Environment",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Documentation",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Markup",
    "Topic :: Utilities"
]

dependencies = [
    "future>=0.14.0; python_version < '3'"
]

[project.optional-dependencies]
test = [
    "flake8==7.5.0",
    "hypothesis==4.24.4"
]

[project.scripts]
cmark = "commonmark.cmark:main"

[tool.setuptools.packages.find]
include = ["commonmark", "commonmark.*"]